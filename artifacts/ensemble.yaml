# Configuración del ensemble (M3, hand-authored). La optimización con Optuna es M7.
# Producido por apps/quant en el futuro; consumido por apps/api para inferir.
version: 'ens-m3-2026-07-07'

# Softmax: temperatura (menor = más decidido) y banda neutra que favorece HOLD.
temperature: 0.5
hold_band: 0.06

# Pesos base por indicador interno (ADX/ATR no votan: son contexto/volatilidad).
weights:
  ema_cross: 1.0
  macd: 1.0
  supertrend: 1.0
  rsi14: 1.0
  bbands: 1.0
  stoch14: 1.0

# Pesos por fuente externa. Reditum (TradingView) entra en SOMBRA: peso 0 hasta que demuestre algo.
#
# Tenía 2.0 —el peso más alto del sistema, el doble que cualquier voto interno— y **cero votos
# emitidos** desde que existe: `external_signals` lleva vacía seis semanas y ni uno de los 3.657
# snapshots registra `reditum_*_score`. Comprobado el 5-sep-2026.
#
# Mientras no emite es inocuo, pero el día que empiece entraría con doble peso sin haber pasado por
# sombra ni por control de nula, que es precisamente lo que el proyecto exigió al Fundamental Score
# (medido, t=2,95, y aun así en sombra al 0,5) y al optimizador. El mecanismo probado a media
# potencia y el no probado a doble no se sostiene.
#
# Para reactivarlo: subirlo a 0.5 y medir su aportación con nula por bloques, como todo lo demás.
external_weights:
  tradingview: 0.0 # en sombra: se registra el voto, no empuja la decisión

# Conmutación por régimen (ADX). En tendencia sube tendencia/momentum; en rango, reversión.
regime:
  adx_threshold: 25
  adx_lo: 15
  adx_hi: 35
  trend: # ADX >= threshold
    trend: 1.5
    momentum: 1.5
    reversion: 0.6
  range: # ADX < threshold
    trend: 0.6
    momentum: 0.8
    reversion: 1.5

# Costes de transacción (M15). Hasta 0.63.0 el backtest medía en BRUTO, y con eso todos los
# listones de gobierno estaban mal calibrados: se exigía +0,05 R de promoción en 15m cuando la
# comisión se lleva 0,3 R por operación.
#
# La conversión a R es lo que importa: `1 R = atr_stop_mult x ATR`, así que cuanto más corta la
# temporalidad menos vale 1 R en dinero y más pesa la misma comisión sobre él. Medido en BTCUSDT:
# 1 R son 0,40 % del precio en 15m y 6,6 % en 1d — el mismo round-trip cuesta 0,30 R y 0,018 R.
#
# Mercado: Binance USDT-M Futuros. `round_trip = 2 x (comisión + deslizamiento)`, porque se paga al
# abrir y al cerrar, y el deslizamiento se cuenta en las dos patas: en la de salida suele ser peor,
# ya que un stop se ejecuta justo cuando el mercado va en contra.
costs:
  enabled: true
  mode: 'taker' # taker | maker
  taker_pct: 0.05 # por orden
  maker_pct: 0.02 # por orden
  slippage_pct: 0.01 # por orden, estimado
  # taker -> 2 x (0,05 + 0,01) = 0,12 % round-trip · maker -> 0,06 %

# Gestión de riesgo para el plan de acción (M4). El capital va por env (ACCOUNT_EQUITY).
risk:
  atr_stop_mult: 1.5 # distancia del stop = 1.5 x ATR
  tp_r_multiple: 2.0 # take-profit a 2R (riesgo:beneficio 1:2)
  risk_pct: 0.01 # se arriesga 1% del capital por operación

# Frescura de la ENTRADA (M5.6, por temporalidad desde M10.5): cuántas velas sigue teniendo sentido
# entrar al precio propuesto. No confundir con `evaluation.horizon_by_tf`, que es el tiempo que se le
# da a la operación una vez abierta.
plan:
  valid_candles: 3
  valid_candles_by_tf: { '1m': 5, '5m': 5, '15m': 4, '30m': 4, '1h': 3, '4h': 3, '1d': 2, '1w': 2, '1M': 1 }

# Horizonte de evaluación (M10.5): velas que se le dan a una operación antes de cerrarla por tiempo.
# ESTE es el parámetro que produce los «timeout». Estaba fijo en 20 para todas las temporalidades,
# escrito como valor por defecto de una función: en 1m cerraba antes de tiempo (31 % de expirados) y
# en 1d exigía 20 días de histórico, así que esos registros no se evaluaban nunca.
evaluation:
  horizon: 20
  horizon_by_tf: { '1m': 30, '5m': 25, '15m': 20, '30m': 20, '1h': 18, '4h': 15, '1d': 10, '1w': 6, '1M': 4 }

# Temporalidades en cuarentena (M10.5): se calculan y se registran, pero NO emiten señal operable.
# 4h acumulaba −0,485 R en 89 decisiones (69 cortos, el 85,6 % al stop). La causa NO era falta de
# contexto macro: M11 reconstruyó el sesgo real del periodo y habría reforzado esos cortos, no
# vetados. Sigue vetada mientras su expediente sombra no demuestre lo contrario.
# Se retira el permiso para operar, no la observación: el backtest sigue simulándola para saber
# cuándo puede levantarse.
# 15m y 30m entran por un motivo DISTINTO al de 4h: no es su expediente, es el coste estructural.
# Medido sobre años de histórico y ~1.850 operaciones por clave, con costes de Binance USDT-M
# Futuros (0,12 % round-trip):
#
#   tf    bruta   coste   neta(taker)  neta(maker)
#   15m  +0,003   0,290     -0,265       -0,131
#   30m  +0,003   0,173     -0,186       -0,094
#   1h   +0,003   0,112     -0,107       -0,052   <- añadida en 0.64.0
#   4h   +0,010   0,041     -0,030       -0,010
#   1d   +0,037   0,015     +0,020       +0,029
#
# La expectancy BRUTA es ≈0 en todas: el ensemble no tiene ventaja en ninguna temporalidad. Lo que
# cambia entre ellas es cuánto pesa el coste, porque `1 R = atr_stop_mult x ATR` y en 15m 1 R son
# 0,40 % del precio frente al 6,6 % de 1d. El mismo round-trip cuesta 0,29 R arriba y 0,015 abajo.
#
# Esto NO se arregla esperando ni afinando pesos: haría falta una ventaja bruta de +0,29 R en 15m
# solo para empatar, y lo medido es +0,003. Por eso es cuarentena **estructural**.
#
# Se retira el permiso para operar, no la observación: el expediente sombra se sigue midiendo, y
# ahora en NETO — así que solo saldrán si de verdad ganan después de pagar al exchange.
quarantine_intervals: ['15m', '30m', '1h', '4h']

# Sesgo fundamental macro (1w+): funding rate + tendencia semanal (EMA 1w).
# Se inyecta en los logits del softmax; si el conflicto es fuerte, degrada a FLAT.
macro:
  enabled: true
  min_interval: '1w'
  w_macro: 1.0
  funding_weight: 0.5
  trend_weight: 0.5
  funding_scale: 0.0005
  trend_scale: 0.05
  conflict_downgrade: true
  conflict_threshold: 0.5
  # Escalado de w_macro por temporalidad (M1) — DESACTIVADO (fase solo-técnico).
  enable_scaling: false
  tf_scale: { '1m': 0.2, '5m': 0.3, '15m': 0.4, '30m': 0.5, '1h': 0.6, '4h': 0.8, '1d': 1.0, '1w': 1.0, '1M': 1.0 }

# Fundamental Score (M12): el funding, situado por percentil sobre ventana móvil de 90 días y
# aplicado SOLO a los largos. Medido sobre 728 decisiones evaluadas: en LARGOS el tercil bajo de
# funding rinde +0,200 R y el alto −0,230 R (t=2,95, supera Bonferroni); en CORTOS no hay patrón.
# Por eso `logit_BUY -= w_fund * penalización` y `logit_SELL` no se toca.
#
# `mode: shadow` -> se calcula, se registra y NO influye. Solo se promociona a `active` si demuestra
# lift >= 0,05 R y AUC >= 0,55 sobre decisiones reales cerradas. Umbrales fijados de antemano.
#
# `absorbs_funding` gobierna además la migración: al pasar a `active`, el funding sale de `macro`
# (funding_weight -> 0) y su peso se transfiere a trend_weight. Sin esa transferencia |bias| <= 0,5
# y el escudo macro, que exige |bias| > conflict_threshold, no volvería a dispararse nunca.
fundamental:
  mode: 'shadow'
  w_fund: 0.5
  start: 0.3333333333333333
  window_days: 90
  absorbs_funding: true
